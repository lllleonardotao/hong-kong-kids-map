<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>香港亲子探索地图｜Anton × 妈妈</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif;color:#172a31;background:#f5f7f8}*{box-sizing:border-box}body{margin:0}.top{padding:22px max(18px,calc((100vw - 1360px)/2));background:white;border-bottom:1px solid #e1e9eb}.eyebrow{color:#168272;font-size:12px;font-weight:700;letter-spacing:1.2px}.top h1{font-size:clamp(23px,3vw,33px);margin:8px 0}.top p{color:#60727b;font-size:14px;margin:0;line-height:1.6}.layout{max-width:1360px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(340px,440px) 1fr;gap:16px}.panel{background:white;border:1px solid #e5ebee;border-radius:16px;overflow:hidden}.controls{padding:17px;border-bottom:1px solid #edf0f2}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.chip{background:#f2f6f6;border:1px solid #d9e4e5;border-radius:22px;padding:8px 13px;color:#29454f;cursor:pointer;font-size:13px}.chip.on{background:#167b6e;color:white;border-color:#167b6e}.list{max-height:68vh;overflow:auto;padding:10px}.place{padding:15px;margin:5px;border:1px solid #e6ecef;border-radius:13px;cursor:pointer}.place:hover,.place.active{background:#eff8f6;border-color:#9bcfc4}.place h3{font-size:16px;margin:0 0 6px}.meta{color:#667983;font-size:12px;margin-bottom:8px}.line{font-size:13px;line-height:1.65;margin:5px 0}.small{color:#6c7e86;font-size:12px}.tag{font-size:11px;background:#e9f4ee;color:#24785e;padding:3px 7px;border-radius:6px}.links{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}a{color:#0c756d;font-size:13px;font-weight:600;text-decoration:none}.mapbox{height:min(78vh,790px);min-height:540px;position:sticky;top:15px}#map{width:100%;height:100%;border-radius:16px}.leaflet-popup-content{min-width:210px;line-height:1.7}.leaflet-popup-content strong{font-size:15px}.foot{max-width:1360px;margin:0 auto 30px;padding:0 20px;color:#6a7a82;font-size:12px;line-height:1.8}@media(max-width:850px){.layout{display:flex;flex-direction:column;padding:10px}.mapbox{height:45vh;min-height:310px;position:relative;order:0}.panel{order:1}.list{max-height:unset}.top{padding:18px}.place{padding:12px}} </style></head><body><header class="top"><div class="eyebrow">HONG KONG WEEKEND EXPLORER</div><h1>香港亲子探索地图 🗺️</h1><p>Anton × 妈妈 · 8个地点、8种知识主题 · 选一座博物馆，再加一场真实生活体验</p></header><main class="layout"><section class="panel"><div class="controls"><strong>筛选主题</strong><div class="chips" id="chips"></div><p class="small">点击地点，地图会自动定位。参考票价可能变化，请在出发前查看官网。</p></div><div class="list" id="list"></div></section><section class="mapbox"><div id="map"></div></section></main><footer class="foot">地图底图：© OpenStreetMap contributors。位置为场馆附近参考坐标。门票、开放时间、预约和儿童资格以场馆官方公告为准。完成记录仅保存在当前浏览器。</footer><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const data=[["香港铁路博物馆","大埔","交通",22.4483,114.16373,"1–1.5小时","免费","无需预约","铁路博物馆 → 大埔墟 → 东铁线","观察旧火车，比较深圳地铁与香港铁路","铁路如何影响城市商业布局？","https://www.heritagemuseum.gov.hk/en/branch_museum/railway.html"],["香港科学馆","尖沙咀东","科学",22.301021,114.17751,"2–3小时","常设展成人约HK$20；儿童资格按官网","通常无需预约；特展另计","科学馆 → 午餐 → 尖沙咀海滨","亲手操作，先猜测再验证","科学知识如何通过互动设计传达？","https://hk.science.museum/"],["M+视觉文化博物馆","西九文化区","设计",22.30083,114.15917,"1.5–2小时","成人票按展览（普通门票参考HK$190起）","建议提前购票；活动可能预约","M+ → 西九艺术公园","看颜色、形状、日常用品设计","现代设计与策展如何影响认知？","https://www.mplus.org.hk/en/admission-tickets/"],["香港海事博物馆","中环8号码头","交通",22.2878,114.1617,"1.5–2小时","成人约HK$30；儿童约HK$15","普通参观一般不用预约","海事博物馆 → 天星小轮 → 海滨","区分客船、货船，体验渡轮","贸易和港口如何支撑香港经济？","https://www.hkmaritimemuseum.org/"],["香港中央图书馆","铜锣湾","语言",22.27996,114.18959,"1–2小时","免费","阅读不用；玩具图书馆需要预约","儿童图书馆 → 维多利亚公园","自己挑书，接触粤语与英文","香港公共教育服务如何运作？","https://www.hkpl.gov.hk/en/locations/central-library/central.html"],["香港湿地公园","天水围","自然",22.4684,114.007,"2–3小时","成人约HK$30；3–17岁约HK$15","一般无需预约；特别活动例外","湿地步道 → 观鸟区","识别湿地植物与鸟类","城市发展和生态保护如何取舍？","https://www.wetlandpark.gov.hk/en"],["香港故宫文化博物馆","西九文化区","历史",22.30163,114.15551,"1.5–2小时","成人普通票参考HK$70起；儿童优惠按官网","建议提前购票；特展另计","故宫文化博物馆 → 西九海滨","看器物、服饰、图案","中国工艺与文化交流的历史","https://www.hkpm.org.hk/en/visit/ticket"],["香港大学生物多样性博物馆","香港大学","科学",22.2835,114.13709,"1–1.5小时","免费","必须提前预约","博物馆 → 港大校园","观察生物标本和身体构造","分类学、进化与科学研究","https://www.hkbiodiversitymuseum.org/visits"]];
let filter="全部",sel=-1;const map=L.map("map").setView([22.36,114.12],11);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors",maxZoom:19}).addTo(map);const markers=[];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
data.forEach((p,i)=>{let m=L.marker([p[3],p[4]]).addTo(map);m.bindPopup("<strong>"+esc(p[0])+"</strong><br>"+esc(p[1])+" · "+esc(p[6])+"<br>"+esc(p[7])+"<br><a target='_blank' rel='noopener' href='"+p[11]+"'>官方门票／预约 ↗</a>");m.on("click",()=>{sel=i;renderList()});markers.push(m)});
const cats=["全部",...new Set(data.map(p=>p[2]))];
function renderChips(){document.querySelector("#chips").innerHTML=cats.map(c=>'<button class="chip '+(filter===c?"on":"")+'" data-c="'+c+'">'+c+"</button>").join("");document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{filter=b.dataset.c;renderChips();renderList();markers.forEach((m,i)=>{if(filter==="全部"||data[i][2]===filter)m.addTo(map);else map.removeLayer(m)})})}
function renderList(){const box=document.querySelector("#list");box.innerHTML=data.map((p,i)=>({p,i})).filter(({p})=>filter==="全部"||p[2]===filter).map(({p,i})=>'<article class="place '+(sel===i?"active":"")+'" data-i="'+i+'"><h3>'+(i+1)+'. '+esc(p[0])+' <span class="tag">'+esc(p[2])+'</span></h3><div class="meta">'+esc(p[1])+' · 建议 '+esc(p[5])+'</div><div class="line"><b>💳 门票：</b>'+esc(p[6])+'</div><div class="line"><b>📆 预约：</b>'+esc(p[7])+'</div><div class="line"><b>🧭 路线：</b>'+esc(p[8])+'</div><div class="line"><b>👦 途途：</b>'+esc(p[9])+'</div><div class="line"><b>👩 妈妈：</b>'+esc(p[10])+'</div><div class="links"><a href="'+p[11]+'" target="_blank" rel="noopener">场馆官网 ↗</a><a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p[0]+" Hong Kong")+'" target="_blank" rel="noopener">Google 地图 ↗</a></div></article>').join("");box.querySelectorAll("[data-i]").forEach(el=>el.onclick=e=>{if(e.target.closest("a"))return;sel=+el.dataset.i;map.setView([data[sel][3],data[sel][4]],14);markers[sel].openPopup();renderList()})}
renderChips();renderList();setTimeout(()=>map.invalidateSize(),250);
</script></body></html>
